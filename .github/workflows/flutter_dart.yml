name: Flutter and Dart

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verify formatting
        # Keep the compatibility shims in their vendored source format.
        run: |
          git ls-files -z -- '*.dart' ':(exclude)legacy_shims/**' |
            xargs -0 --no-run-if-empty dart format --output=none --set-exit-if-changed

      - name: Run tests
        run: flutter test -r github
